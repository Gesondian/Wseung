services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lowcode
      POSTGRES_USER: lowcode
      POSTGRES_PASSWORD: lowcode_dev_password
    ports:
      - "5432:5432"
    volumes:
      - lowcode_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lowcode_minio_data:/data

volumes:
  lowcode_postgres_data:
  lowcode_minio_data:
